name: ktailoring_erp
description: "KTown Aari Works Tailoring ERP - Android Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Networking & Auth
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Routing
  go_router: ^14.0.1

  # Local DB / Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Fonts & Styling
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6

  # Device Hardware Features
  signature: ^5.4.0
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  mobile_scanner: ^5.1.1
  open_filex: ^4.4.0

  # Voice Notes
  record: ^5.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  # Gallery & Image Viewing
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Bluetooth Thermal / Label Printing
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.3

  # Full A4 / Wi-Fi Document Printing (Brother, Epson, HP)
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
